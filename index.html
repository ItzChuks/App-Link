<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="index.css">
    <title>App Link Log in</title>
</head>
<body>
    <div class="main-container">
        <h1 class="text-header">APP LINK</h1><br>
        <form onsubmit="validateLogin(event)" autocomplete="off">
            <input id="username" type="text" autocomplete="off" placeholder="Username" required><br><br><br>
            <input id="password" type="password" autocomplete="off" placeholder="Password" required><br><br><br>
            <button class="login-btn" type="submit">Log In</button>
        </form>
    </div>
    <script>
        window.onload = function() {

            if (sessionStorage.getItem("authenticated") === "true") {
                window.location.href = "main.html";
                return;
            }

            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }

        window.addEventListener("pageshow", function (event){
            if (event.persisted || window.performance.navigation.type === 2) {
                window.location.reload();
            }
        });

        function validateLogin(event) {
            event.preventDefault(); // Prevent form submission

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const validUsername = "admin";
            const validPassword = "4613448351";

            if (username === validUsername && password === validPassword){
                window.location.href = "main.html";
            }
            else{
                alert("Invalid username or password");
            }
        }

    </script>
</body>
</html>
